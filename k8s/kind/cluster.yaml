# kept in a subdirectory so `kubectl apply -f k8s/` skips it - this is a kind
# config, not a kubernetes resource
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # serve
        hostPort: 30080
      - containerPort: 30300   # grafana
        hostPort: 30300
