apiVersion: apps/v1
kind: Deployment
metadata:
  name: serve
spec:
  # no replicas field on purpose - the hpa owns it, and leaving it here would
  # reset the count to 2 on every `kubectl apply`
  selector:
    matchLabels:
      app: serve
  template:
    metadata:
      labels:
        app: serve
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: serve
          image: ml-serve:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: serve-config
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # the model loads before uvicorn accepts traffic, so /health answering
          # at all means the pod is ready
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: serve
spec:
  type: NodePort
  selector:
    app: serve
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
