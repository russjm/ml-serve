[project]
name = "ml-serve"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.138.0",
    "prometheus-client>=0.26.0",
    "redis>=8.0.1",
    "torch>=2.2,<3",
    "transformers>=5.12.1",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "locust>=2.46.4",
    "matplotlib>=3.11.1",
    "numpy>=2.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
