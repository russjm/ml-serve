[project]
name = "ml-serve"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.138.0",
    "torch>=2.2,<3",
    "transformers>=5.12.1",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
